<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Schauinsland summit climb">
  <defs>
    <linearGradient id="shSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa8d8"/>
      <stop offset="1" stop-color="#dcecf2"/>
    </linearGradient>
    <linearGradient id="shPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8f72"/>
      <stop offset="1" stop-color="#4f7458"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#shSky)"/>
  <circle cx="150" cy="90" r="38" fill="#fff3cc"/>
  <!-- far ranges -->
  <path d="M0 250 L150 180 L320 245 L470 175 L640 245 L800 200 L800 300 L0 300 Z" fill="#8aa6ad" opacity="0.7"/>
  <!-- main summit -->
  <path d="M250 450 L560 110 L800 450 Z" fill="url(#shPeak)"/>
  <path d="M560 110 L640 220 L520 200 Z" fill="#e9f1f2" opacity="0.85"/>
  <!-- lower foreground hill -->
  <path d="M0 300 L260 200 L420 300 L520 250 L800 360 L800 450 L0 450 Z" fill="#3f6b4f"/>
  <!-- summit lookout tower -->
  <g>
    <rect x="552" y="86" width="14" height="34" fill="#9aa7ac"/>
    <polygon points="548,86 559,70 570,86" fill="#7c878c"/>
  </g>
  <!-- pine line -->
  <g fill="#2f5742">
    <polygon points="120,300 134,340 106,340"/><polygon points="180,320 194,358 166,358"/>
    <polygon points="60,330 74,368 46,368"/>
  </g>
  <!-- hairpin climbing road -->
  <path d="M120 450 C300 430 240 392 400 380 C300 372 320 336 470 326 C360 318 380 286 520 270 C440 262 470 232 558 168"
        fill="none" stroke="#ff5722" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
</svg>
