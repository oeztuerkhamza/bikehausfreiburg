<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Kaiserstuhl terraced vineyard hills">
  <defs>
    <linearGradient id="ksSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad7ec"/>
      <stop offset="1" stop-color="#f3ead0"/>
    </linearGradient>
    <linearGradient id="ksHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb46f"/>
      <stop offset="1" stop-color="#a98f4d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ksSky)"/>
  <circle cx="660" cy="96" r="42" fill="#ffe6a3"/>
  <!-- far volcanic ridge -->
  <path d="M0 200 L130 150 L280 195 L430 140 L600 190 L730 150 L800 185 L800 250 L0 250 Z" fill="#7a8f63"/>
  <!-- terraced loess hills (stepped) -->
  <path d="M0 250 L800 230 L800 280 L0 300 Z" fill="#bfa766"/>
  <path d="M0 300 L800 280 L800 332 L0 352 Z" fill="#b39a58"/>
  <path d="M0 352 L800 332 L800 392 L0 410 Z" fill="url(#ksHill)"/>
  <path d="M0 410 L800 392 L800 450 L0 450 Z" fill="#9c8347"/>
  <!-- vine rows on terraces -->
  <g stroke="#6f5f2e" stroke-width="2.5" opacity="0.65">
    <line x1="40" y1="276" x2="760" y2="258"/>
    <line x1="40" y1="328" x2="760" y2="308"/>
    <line x1="40" y1="386" x2="760" y2="368"/>
  </g>
  <!-- dashed road climbing the terraces -->
  <path d="M120 440 C260 400 220 360 360 330 C500 300 470 262 640 232" fill="none" stroke="#ff5722" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16"/>
  <!-- wine village rooftops -->
  <g>
    <rect x="150" y="300" width="26" height="20" fill="#e9e3d6"/><polygon points="150,300 163,288 176,300" fill="#c0432f"/>
    <rect x="182" y="304" width="22" height="16" fill="#e9e3d6"/><polygon points="182,304 193,294 204,304" fill="#c0432f"/>
  </g>
</svg>
