<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Dreisam river valley toward the Black Forest">
  <defs>
    <linearGradient id="drSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f2"/>
      <stop offset="1" stop-color="#f6ead2"/>
    </linearGradient>
    <linearGradient id="drRiver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaf6"/>
      <stop offset="1" stop-color="#7cc4e0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#drSky)"/>
  <circle cx="640" cy="92" r="40" fill="#ffd089"/>
  <circle cx="640" cy="92" r="40" fill="#ffb74d" opacity="0.35"/>
  <!-- far forested hills -->
  <path d="M0 210 L120 150 L260 200 L420 140 L560 195 L700 150 L800 190 L800 300 L0 300 Z" fill="#3f6f63"/>
  <path d="M0 250 L160 200 L320 245 L500 195 L660 245 L800 215 L800 330 L0 330 Z" fill="#4e8a74"/>
  <!-- black forest pines at valley head -->
  <g fill="#2f5d4f">
    <polygon points="400,150 414,196 386,196"/>
    <polygon points="424,160 436,200 412,200"/>
    <polygon points="378,162 390,200 366,200"/>
  </g>
  <!-- near meadow -->
  <path d="M0 300 Q400 270 800 305 L800 450 L0 450 Z" fill="#7bb86a"/>
  <path d="M0 360 Q400 335 800 365 L800 450 L0 450 Z" fill="#69a85a"/>
  <!-- river -->
  <path d="M360 200 C320 270 470 300 420 360 C390 405 470 430 440 450 L520 450 C540 410 470 380 510 345 C560 300 430 270 470 210 Z" fill="url(#drRiver)"/>
  <!-- dashed cycle route along the bank -->
  <path d="M150 440 C260 380 250 330 360 305 C470 280 470 220 600 175" fill="none" stroke="#ff5722" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16"/>
  <!-- trees -->
  <g>
    <rect x="173" y="338" width="6" height="20" fill="#6b4a2f"/><circle cx="176" cy="330" r="18" fill="#4e8a55"/>
    <rect x="617" y="300" width="6" height="20" fill="#6b4a2f"/><circle cx="620" cy="292" r="16" fill="#4e8a55"/>
  </g>
</svg>
