<!-- HERO SECTION - 2026 MODERN DESIGN (Pure CSS + Tailwind Ready)   -->
<!-- ═══════════════════════════════════════════════════════════════════ -->

<section class="hero-2026" role="banner" aria-label="Hero Section">
  <!-- VIDEO BACKGROUND (performance-aware, lazy loaded) -->
  @if (videoEnabled()) {
    <div class="hero-video-wrapper">
      <video
        #heroVideo
        class="hero-video-bg"
        [src]="videoSrc()"
        poster="assets/videos/hero-poster.webp"
        autoplay
        muted
        playsinline
        preload="none"
        (loadeddata)="onVideoReady()"
        (ended)="onVideoEnded()"
        aria-hidden="true"
      ></video>
      <div class="hero-video-overlay"></div>
    </div>
  }

  <!-- ANIMATED BACKGROUND SHAPES (shown when no video / mobile) -->
  <div class="hero-bg-wrapper" [class.hero-bg-behind-video]="videoEnabled()">
    <!-- Gradient Blob 1 -->
    <div class="blob blob-1"></div>

    <!-- Gradient Blob 2 -->
    <div class="blob blob-2"></div>

    <!-- Gradient Blob 3 -->
    <div class="blob blob-3"></div>

    <!-- Grid Pattern Overlay -->
    <div class="grid-overlay"></div>
  </div>

  <!-- CONTENT CONTAINER -->
  <div class="hero-content">
    <!-- MAIN CONTENT -->
    <div class="hero-text-wrapper">
      <!-- BADGE -->
      <div class="hero-badge">
        <span class="badge-dot"></span>
        <span class="badge-text">🚴 Bike Haus Freiburg</span>
      </div>

      <!-- MAIN HEADING - WITH GRADIENT -->
      <h1 class="hero-title">
        <span class="title-line">Die beste</span>
        <span class="title-gradient">Fahrrad-Erfahrung</span>
        <span class="title-line">in Freiburg</span>
      </h1>

      <!-- SUBTITLE -->
      <p class="hero-subtitle">
        Verkauf • Service • Verleih. Alles aus einer Hand mit über 10+ Jahren
        Erfahrung und persönlicher Beratung.
      </p>

      <!-- CTA BUTTONS - GLASSMORPHISM -->
      <div class="hero-cta-group">
        <!-- Primary CTA -->
        <a
          routerLink="/de/neue-fahrraeder"
          class="btn btn-primary"
          role="button"
          tabindex="0"
        >
          <span class="btn-text">Jetzt Fahrrad kaufen</span>
          <svg
            class="btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M13 7l5 5m0 0l-5 5m5-5H6" />
          </svg>
        </a>

        <!-- Secondary CTA - GLASS STYLE -->
        <a
          routerLink="/de/fahrradverleih"
          class="btn btn-secondary"
          role="button"
          tabindex="0"
        >
          <span class="btn-text">Zur Vermietung</span>
          <svg
            class="btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M9 19l-7-7m0 0l7-7m-7 7h16" />
          </svg>
        </a>
      </div>

      <!-- STATS ROW - GLASSMORPHIC CARDS -->
      <div class="hero-stats">
        <!-- Stat Card 1 -->
        <div class="stat-card">
          <div class="stat-number">500+</div>
          <div class="stat-label">Fahrräder</div>
        </div>

        <!-- Stat Card 2 -->
        <div class="stat-card">
          <div class="stat-number">10+</div>
          <div class="stat-label">Jahre</div>
        </div>

        <!-- Stat Card 3 -->
        <div class="stat-card">
          <div class="stat-number">⭐ 4.9</div>
          <div class="stat-label">Rating</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCROLL INDICATOR - ANIMATED -->
  <div class="hero-scroll-indicator">
    <span class="scroll-label">Scroll</span>
    <svg
      class="scroll-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M19 14l-7 7m0 0l-7-7m7 7V3" />
    </svg>
  </div>
</section>
