name: Server Memory Watch

# Am 25.08.2026 war der Server ueber Stunden weder per HTTPS noch per SSH
# erreichbar: Das Chromium des Kleinanzeigen-Scrapers hatte den Speicher
# leergeraeumt (OOM-Kills am 12., 23. und 24.08. im Kernel-Log), die Maschine
# steckte im Swap-Thrashing und musste neu gestartet werden. Aufgefallen ist es
# erst, als der Laden die Adminoberflaeche nicht mehr oeffnen konnte.
#
# Dieser Lauf schaut zweimal taeglich nach und schlaegt an, BEVOR es so weit
# kommt: zu wenig freier Speicher, echtes Swap-Thrashing, ein OOM-Kill seit dem
# letzten Blick — oder ein Container, der ohne Speicherlimit laeuft.
#
# Ein Alarm muss selten sein, sonst schaut niemand mehr hin. Wo ein Wert fuer
# sich genommen noch nichts bedeutet, steht er als ::warning:: im Lauf, ohne
# ihn rot zu faerben.

permissions:
  contents: read

on:
  schedule:
    # 06:40 und 18:40 UTC — jeweils kurz nach den ueblichen Scraper-Laeufen.
    - cron: '40 6,18 * * *'
  workflow_dispatch:

jobs:
  memory-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Probe memory, swap and OOM history
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          # capture_stdout bewusst NICHT gesetzt: die ssh-action schreibt die
          # gesammelte Ausgabe ueber ein EOF-Heredoc nach $GITHUB_OUTPUT und
          # scheitert an mehrzeiligem Text ("Matching delimiter not found").
          # Die Messwerte stehen ohnehin in den ::error::-Meldungen.
          script: |
            set -u
            status=0

            echo "=== Speicher ==="
            free -m
            avail=$(free -m | awk '/^Mem:/ {print $7}')
            swap_used=$(free -m | awk '/^Swap:/ {print $3}')
            swap_total=$(free -m | awk '/^Swap:/ {print $2}')
            echo "verfuegbar: ${avail} MB | Swap belegt: ${swap_used} von ${swap_total} MB"

            # Schwellen bewusst grosszuegig: Es geht um "kippt gleich", nicht um
            # jede normale Lastspitze.
            if [ "${avail}" -lt 400 ]; then
              echo "::error::Nur noch ${avail} MB verfuegbar — der Host ist kurz vor dem Swap-Thrashing."
              status=1
            elif [ "${avail}" -lt 700 ]; then
              echo "::warning::Verfuegbarer Speicher niedrig: ${avail} MB."
            fi

            echo ""
            echo "=== Swap: Umschlag statt Belegung ==="
            # Die BELEGUNG des Swaps sagt fuer sich genommen nichts aus: Linux
            # lagert kalte Seiten aus und holt sie nicht von selbst zurueck, die
            # Belegung faellt also im Betrieb praktisch nie wieder. Auf diesem
            # Host standen am 25.08. 1455 MB (07:28) bzw. 1880 MB (19:16) im
            # Swap — bei 1216 bzw. 986 MB freiem Speicher, ohne einen einzigen
            # OOM-Kill und bei Last ~1. Die alte Schwelle ("belegt > 1200 MB")
            # hat deshalb jeden Lauf rot gefaerbt, ohne dass etwas los war.
            #
            # Weh tut nicht die Belegung, sondern die RATE: Seiten, die dauernd
            # rein- und rausgeschoben werden. Genau das ist Thrashing, und genau
            # das misst /proc/vmstat ueber ein Zeitfenster.
            page_kb=$(( $(getconf PAGESIZE 2>/dev/null || echo 4096) / 1024 ))
            swap_pages() { awk '/^pswpin |^pswpout /{s+=$2} END{print s+0}' /proc/vmstat; }
            fenster=20
            vorher=$(swap_pages)
            sleep "${fenster}"
            nachher=$(swap_pages)
            rate=$(( (nachher - vorher) * page_kb / fenster ))
            echo "Umschlag: ${rate} KB/s (gemessen ueber ${fenster} s)"

            if [ "${rate}" -gt 5120 ]; then
              echo "::error::Swap-Umschlag ${rate} KB/s — die Maschine schiebt dauernd Seiten hin und her (Thrashing)."
              status=1
            elif [ "${rate}" -gt 1024 ]; then
              echo "::warning::Swap-Umschlag erhoeht: ${rate} KB/s."
            fi

            # Belegung bleibt Kontext. Sie wird erst zum Alarm, wenn zugleich der
            # Arbeitsspeicher knapp ist: dann gibt es kein Ausweichen mehr und
            # als naechstes kommt der OOM-Killer.
            if [ "${swap_total}" -gt 0 ]; then
              swap_pct=$(( swap_used * 100 / swap_total ))
            else
              swap_pct=0
            fi
            if [ "${swap_pct}" -ge 90 ] && [ "${avail}" -lt 600 ]; then
              echo "::error::Swap zu ${swap_pct}% belegt UND nur ${avail} MB Arbeitsspeicher — der Puffer ist aufgebraucht."
              status=1
            elif [ "${swap_pct}" -ge 75 ]; then
              echo "::warning::Swap zu ${swap_pct}% belegt (${swap_used} von ${swap_total} MB) — allein unkritisch, aber im Blick behalten."
            fi

            echo ""
            echo "=== Container nach Speicher ==="
            docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}' \
              | sort -k2 -h -r | head -8

            echo ""
            echo "=== Greifen die Speicherlimits? ==="
            # Beide Container fahren ein eigenes Chromium — bikehaus-app das des
            # Kleinanzeigen-Scrapers, bikehaus-whatsapp das der WhatsApp-Web-
            # Bruecke (whatsapp-web.js/puppeteer). Ohne Limit kann jedes davon
            # den ganzen Host leerraeumen; genau so kam es am 25.08.
            for container in bikehaus-app bikehaus-whatsapp; do
              limit=$(docker inspect "${container}" --format '{{.HostConfig.Memory}}' 2>/dev/null || echo 0)
              if [ "${limit:-0}" = "0" ]; then
                echo "::error::${container} laeuft OHNE mem_limit — sein Chromium kann erneut den ganzen Host mitnehmen."
                status=1
              else
                echo "${container}: $((limit / 1024 / 1024)) MB — gesetzt."
              fi
            done

            echo ""
            echo "=== OOM-Kills der letzten 24 h ==="
            # WICHTIG: "journalctl -k" (und --merge --dmesg) liefern NUR den
            # aktuellen Boot. Genau dieser Vorfall endet aber im Neustart — die
            # Spuren laegen dann im Boot davor und der Check gaebe faelschlich
            # Entwarnung. Auf dem Server geprueft: -k findet 0, -t kernel findet 3.
            oom=$(journalctl -t kernel --since '24 hours ago' --no-pager 2>/dev/null \
                  | grep -ciE 'out of memory|oom-kill' || true)
            if [ "${oom:-0}" -gt 0 ]; then
              echo "::error::${oom} OOM-Eintraege in den letzten 24 h:"
              journalctl -t kernel --since '24 hours ago' --no-pager 2>/dev/null \
                | grep -iE 'out of memory|oom-kill' | tail -5
              status=1
            else
              echo "keine."
            fi

            echo ""
            echo "=== Laufzeit ==="
            uptime
            # Ein sehr junger Host nach einem Vorfall ist ein Hinweis auf einen
            # Neustart, den niemand bewusst ausgeloest hat.
            up_min=$(awk '{print int($1/60)}' /proc/uptime)
            if [ "${up_min}" -lt 30 ]; then
              echo "::warning::Host laeuft erst seit ${up_min} Minuten — gab es einen ungeplanten Neustart?"
            fi

            exit ${status}
