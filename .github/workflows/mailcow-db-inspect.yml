name: Mailcow DB Inspect

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect mailcow DB tables and domains
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            MAILCOW_DIR=""
            for d in /opt/mailcow-dockerized /opt/mailcow /root/mailcow-dockerized /root/mailcow ~/mailcow-dockerized ~/mailcow; do
              if [ -d "$d" ] && [ -f "$d/mailcow.conf" ]; then
                MAILCOW_DIR="$d"
                break
              fi
            done
            cd "$MAILCOW_DIR"
            source mailcow.conf

            echo "=== Tum tablolar ==="
            docker compose exec -T mysql-mailcow mysql \
              -u"$DBUSER" -p"$DBPASS" "$DBNAME" \
              -e "SHOW TABLES;"

            echo ""
            echo "=== Domain listesi ==="
            docker compose exec -T mysql-mailcow mysql \
              -u"$DBUSER" -p"$DBPASS" "$DBNAME" \
              -e "SELECT domain FROM domain LIMIT 20;" 2>/dev/null || \
            docker compose exec -T mysql-mailcow mysql \
              -u"$DBUSER" -p"$DBPASS" "$DBNAME" \
              -e "SELECT name FROM domains LIMIT 20;" 2>/dev/null || echo "(tablo bulunamadi)"