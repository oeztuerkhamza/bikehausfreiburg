name: Mailcow DB Inspect

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect mailcow DB tables and domains
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set +e
            MAILCOW_DIR=""
            for d in /opt/mailcow-dockerized /opt/mailcow /root/mailcow-dockerized /root/mailcow ~/mailcow-dockerized ~/mailcow; do
              if [ -d "$d" ] && [ -f "$d/mailcow.conf" ]; then
                MAILCOW_DIR="$d"
                break
              fi
            done
            cd "$MAILCOW_DIR"
            source mailcow.conf

            echo "=== domain tablosu yapisi ==="
            docker compose exec -T mysql-mailcow mysql \
              -u"$DBUSER" -p"$DBPASS" "$DBNAME" \
              -e "DESCRIBE domain;"

            echo ""
            echo "=== bikehausfreiburg.com DKIM bilgisi ==="
            docker compose exec -T mysql-mailcow mysql \
              -u"$DBUSER" -p"$DBPASS" "$DBNAME" \
              -e "SELECT domain, dkim_selector, LEFT(dkim_privatekey,50) as key_preview FROM domain WHERE domain='bikehausfreiburg.com';" 2>/dev/null || \
            docker compose exec -T mysql-mailcow mysql \
              -u"$DBUSER" -p"$DBPASS" "$DBNAME" \
              -e "SELECT * FROM domain WHERE domain='bikehausfreiburg.com'\G" 2>/dev/null | head -30