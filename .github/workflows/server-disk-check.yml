name: Server Disk Check (one-shot)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  disk-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check disk space on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "=== Disk Usage ==="
            df -h

            echo ""
            echo "=== Docker disk usage ==="
            docker system df

            echo ""
            echo "=== Largest directories in /opt/bikehaus ==="
            du -sh /opt/bikehaus/* 2>/dev/null | sort -rh | head -20

            echo ""
            echo "=== /app/data volume size ==="
            docker run --rm -v bikehaus_bikehaus-data:/data alpine du -sh /data 2>/dev/null || echo "(volume not accessible)"
