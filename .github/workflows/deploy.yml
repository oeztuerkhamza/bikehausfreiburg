name: Deploy to Netcup

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-netcup
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      homepage: ${{ steps.filter.outputs.homepage }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            homepage:
              - 'BikeHaus.Homepage/**'

  deploy-api:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: INDEXNOW_API_KEY,JWT_SECRET_KEY
          script: |
            set -e
            cd /opt/bikehaus
            echo "Current server commit: $(git rev-parse --short HEAD || echo unknown)"
            git fetch --prune origin master
            git checkout master
            git reset --hard origin/master
            echo "Deploying commit: $(git rev-parse --short HEAD)"
            # Write secrets to .env file for docker compose
            echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}" > .env
            echo "INDEXNOW_API_KEY=${INDEXNOW_API_KEY}" >> .env
            chmod 600 .env
            docker compose build --pull bikehaus
            docker compose up -d --force-recreate bikehaus nginx
            docker compose ps
            docker image prune -f
            echo "Deploy complete!"

  deploy-homepage:
    needs: changes
    if: needs.changes.outputs.homepage == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BikeHaus.Homepage
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BikeHaus.Homepage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Clean target directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/bikehaus/homepage-dist
            find /opt/bikehaus/homepage-dist -mindepth 1 -delete

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'BikeHaus.Homepage/dist/bike-haus.homepage/browser/'
          target: '/opt/bikehaus/homepage-dist'
          strip_components: 4
          rm: false

      - name: Fix permissions and restart nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            chmod -R 755 /opt/bikehaus/homepage-dist
            find /opt/bikehaus/homepage-dist -type f -exec chmod 644 {} \;
            docker restart bikehaus-nginx
            echo "Homepage deployed successfully!"

  healthcheck:
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-homepage]
    if: always() && needs.deploy-api.result == 'success'
    steps:
      - name: Health check endpoints
        run: |
          urls=(
            "https://bikehausfreiburg.com"
            "https://admin.bikehausfreiburg.com"
            "https://api.bikehausfreiburg.com/api/public/neue-fahrraeder"
            "https://api.bikehausfreiburg.com/api/public/accessories"
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [[ "$code" != "200" ]]; then
              echo "Health check failed for $url (status $code)"
              exit 1
            fi
          done
          echo "All endpoints healthy!"
