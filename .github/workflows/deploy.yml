name: Deploy to Netcup

permissions:
  contents: read

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_logout:
        description: Rotate the JWT secret to log out all users
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-netcup
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      homepage: ${{ steps.filter.outputs.homepage }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            homepage:
              - 'BikeHaus.Homepage/**'

  deploy-api:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          FORCE_LOGOUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_logout || 'false' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: FORCE_LOGOUT,JWT_SECRET_KEY,INDEXNOW_API_KEY,SMTP_PASSWORD
          command_timeout: 30m
          script: |
            set -e
            cd /opt/bikehaus

            # FORCE_LOGOUT rotates the JWT secret so all existing sessions become invalid.
            if [ "${FORCE_LOGOUT:-false}" = "true" ]; then
              JWT_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\n')
              echo "JWT_SECRET_KEY: forced rotation enabled"
            elif [ -z "${JWT_SECRET_KEY}" ]; then
              if [ -f .env ] && grep -q '^JWT_SECRET_KEY=' .env; then
                JWT_SECRET_KEY=$(grep '^JWT_SECRET_KEY=' .env | cut -d'=' -f2-)
                echo "JWT_SECRET_KEY: using existing value from server .env"
              else
                JWT_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\n')
                echo "JWT_SECRET_KEY: generated new value (first deploy)"
              fi
            fi

            # Optional secrets: read from existing .env if not provided via GitHub secret
            _read_env() {
              local key="$1"
              [ -f .env ] && grep -q "^${key}=" .env && grep "^${key}=" .env | cut -d'=' -f2- || true
            }
            [ -z "${INDEXNOW_API_KEY}" ] && INDEXNOW_API_KEY="$(_read_env INDEXNOW_API_KEY)"
            GOOGLE_PLACES_API_KEY="$(_read_env GOOGLE_PLACES_API_KEY)"
            GOOGLE_PLACES_PLACE_ID="$(_read_env GOOGLE_PLACES_PLACE_ID)"
            [ -z "${SMTP_PASSWORD}" ] && SMTP_PASSWORD="$(_read_env SMTP_PASSWORD)"
            echo "Current server commit: $(git rev-parse --short HEAD || echo unknown)"
            git fetch --prune origin master
            git checkout master
            git reset --hard origin/master
            echo "Deploying commit: $(git rev-parse --short HEAD)"
            printf 'JWT_SECRET_KEY=%s\nINDEXNOW_API_KEY=%s\nGOOGLE_PLACES_API_KEY=%s\nGOOGLE_PLACES_PLACE_ID=%s\nSMTP_PASSWORD=%s\n' \
              "${JWT_SECRET_KEY}" "${INDEXNOW_API_KEY}" "${GOOGLE_PLACES_API_KEY}" "${GOOGLE_PLACES_PLACE_ID}" "${SMTP_PASSWORD}" > .env
            chmod 600 .env
            echo "Pre-pulling base images to keep SSH session alive..."
            docker pull node:20-alpine &
            docker pull mcr.microsoft.com/dotnet/sdk:9.0 &
            docker pull mcr.microsoft.com/playwright/dotnet:v1.49.0-noble &
            docker pull mcr.microsoft.com/dotnet/aspnet:9.0 &
            wait
            echo "Base images ready."
            docker compose build bikehaus homepage
            docker compose up -d --force-recreate bikehaus homepage nginx
            docker compose ps
            docker image prune -f
            echo "Deploy complete!"

  deploy-homepage:
    needs: changes
    if: needs.changes.outputs.homepage == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BikeHaus.Homepage
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BikeHaus.Homepage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Clean target directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/bikehaus/homepage-dist/browser
            find /opt/bikehaus/homepage-dist/browser -mindepth 1 -delete

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'BikeHaus.Homepage/dist/bike-haus.homepage/browser/'
          target: '/opt/bikehaus/homepage-dist/browser'
          strip_components: 3
          rm: false

      - name: Fix permissions and restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            chmod -R 755 /opt/bikehaus/homepage-dist/browser
            find /opt/bikehaus/homepage-dist/browser -type f -exec chmod 644 {} \;
            cd /opt/bikehaus
            docker compose build --pull homepage
            docker compose up -d --force-recreate homepage nginx
            echo "Homepage deployed successfully!"

  healthcheck:
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-homepage]
    if: always() && needs.deploy-api.result == 'success'
    steps:
      - name: Health check endpoints
        run: |
          set -e
          urls=(
            "https://bikehausfreiburg.com"
            "https://admin.bikehausfreiburg.com"
            "https://api.bikehausfreiburg.com/api/public/neue-fahrraeder"
            "https://api.bikehausfreiburg.com/api/public/accessories"
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            code=$(curl --retry 5 --retry-delay 5 --connect-timeout 10 --max-time 30 -s -o /dev/null -w "%{http_code}" "$url")
            if [[ "$code" != "200" ]]; then
              echo "Health check failed for $url (status $code)"
              exit 1
            fi
          done
          echo "All endpoints healthy!"
