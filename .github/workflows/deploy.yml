name: Deploy to Netcup

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/bikehaus
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build
            docker image prune -f
            echo "Deploy complete!"

  healthcheck:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check endpoints
        run: |
          urls=(
            "https://bikehausfreiburg.com"
            "https://admin.bikehausfreiburg.com"
            "https://api.bikehausfreiburg.com/api/public/neue-fahrraeder"
            "https://api.bikehausfreiburg.com/api/public/accessories"
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [[ "$code" != "200" ]]; then
              echo "Health check failed for $url (status $code)"
              exit 1
            fi
          done
          echo "All endpoints healthy!"
