name: Deploy to Netcup

permissions:
  contents: read

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_logout:
        description: Rotate the JWT secret to log out all users
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-netcup
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      homepage: ${{ steps.filter.outputs.homepage }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            homepage:
              - 'BikeHaus.Homepage/**'

  build-homepage:
    needs: changes
    if: needs.changes.outputs.homepage == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BikeHaus.Homepage
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BikeHaus.Homepage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: homepage-dist
          path: BikeHaus.Homepage/dist/bike-haus.homepage/browser/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [changes, build-homepage]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.build-homepage.result == 'success' || needs.build-homepage.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download homepage artifact
        if: needs.build-homepage.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: homepage-dist
          path: homepage-dist/

      - name: Upload homepage to staging directory
        if: needs.build-homepage.result == 'success'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'homepage-dist/'
          target: '/opt/bikehaus/homepage-staging'
          strip_components: 1
          rm: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          FORCE_LOGOUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_logout || 'false' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          HOMEPAGE_UPDATED: ${{ needs.build-homepage.result == 'success' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: FORCE_LOGOUT,JWT_SECRET_KEY,INDEXNOW_API_KEY,SMTP_PASSWORD,HOMEPAGE_UPDATED
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/bikehaus

            echo "==> Resolving secrets"
            if [ "${FORCE_LOGOUT:-false}" = "true" ]; then
              JWT_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\n')
              echo "JWT_SECRET_KEY: forced rotation enabled"
            elif [ -z "${JWT_SECRET_KEY:-}" ]; then
              if [ -f .env ] && grep -q '^JWT_SECRET_KEY=' .env; then
                JWT_SECRET_KEY=$(grep '^JWT_SECRET_KEY=' .env | cut -d'=' -f2-)
                echo "JWT_SECRET_KEY: using existing value from server .env"
              else
                JWT_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\n')
                echo "JWT_SECRET_KEY: generated new value (first deploy)"
              fi
            fi

            _read_env() {
              local key="$1"
              if [ -f .env ] && grep -q "^${key}=" .env; then
                grep "^${key}=" .env | head -n1 | cut -d'=' -f2-
              fi
            }
            [ -z "${INDEXNOW_API_KEY:-}" ] && INDEXNOW_API_KEY="$(_read_env INDEXNOW_API_KEY)"
            GOOGLE_PLACES_API_KEY="$(_read_env GOOGLE_PLACES_API_KEY)"
            GOOGLE_PLACES_PLACE_ID="$(_read_env GOOGLE_PLACES_PLACE_ID)"
            [ -z "${SMTP_PASSWORD:-}" ] && SMTP_PASSWORD="$(_read_env SMTP_PASSWORD)"

            echo "==> Updating source"
            echo "Current server commit: $(git rev-parse --short HEAD || echo unknown)"
            git fetch --prune origin master
            git checkout master
            git reset --hard origin/master
            DEPLOY_SHA=$(git rev-parse --short HEAD)
            echo "Deploying commit: ${DEPLOY_SHA}"

            echo "==> Writing .env"
            umask 077
            printf 'JWT_SECRET_KEY=%s\nINDEXNOW_API_KEY=%s\nGOOGLE_PLACES_API_KEY=%s\nGOOGLE_PLACES_PLACE_ID=%s\nSMTP_PASSWORD=%s\n' \
              "${JWT_SECRET_KEY}" "${INDEXNOW_API_KEY}" "${GOOGLE_PLACES_API_KEY}" "${GOOGLE_PLACES_PLACE_ID}" "${SMTP_PASSWORD}" > .env
            chmod 600 .env
            umask 022

            if [ "${HOMEPAGE_UPDATED}" = "true" ]; then
              echo "==> Promoting homepage build (atomic swap)"
              if [ ! -d /opt/bikehaus/homepage-staging ] || [ -z "$(ls -A /opt/bikehaus/homepage-staging 2>/dev/null)" ]; then
                echo "ERROR: staging directory empty — refusing to swap"
                exit 1
              fi
              mkdir -p /opt/bikehaus/homepage-dist/browser
              find /opt/bikehaus/homepage-staging -type d -exec chmod 755 {} \;
              find /opt/bikehaus/homepage-staging -type f -exec chmod 644 {} \;
              # Atomic swap: rename current → backup, staging → current
              if [ -d /opt/bikehaus/homepage-dist/browser.old ]; then
                rm -rf /opt/bikehaus/homepage-dist/browser.old
              fi
              if [ -d /opt/bikehaus/homepage-dist/browser ] && [ -n "$(ls -A /opt/bikehaus/homepage-dist/browser 2>/dev/null)" ]; then
                mv /opt/bikehaus/homepage-dist/browser /opt/bikehaus/homepage-dist/browser.old
              else
                rm -rf /opt/bikehaus/homepage-dist/browser
              fi
              mv /opt/bikehaus/homepage-staging /opt/bikehaus/homepage-dist/browser
            fi

            echo "==> Pre-pulling base images"
            docker pull node:20-alpine &
            docker pull mcr.microsoft.com/dotnet/sdk:9.0 &
            docker pull mcr.microsoft.com/playwright/dotnet:v1.49.0-noble &
            docker pull mcr.microsoft.com/dotnet/aspnet:9.0 &
            wait

            echo "==> Building images"
            if [ "${HOMEPAGE_UPDATED}" = "true" ]; then
              docker compose build bikehaus homepage
            else
              docker compose build bikehaus
            fi

            echo "==> Recreating containers"
            if [ "${HOMEPAGE_UPDATED}" = "true" ]; then
              docker compose up -d --force-recreate bikehaus homepage
            else
              docker compose up -d --force-recreate bikehaus
            fi

            echo "==> Reloading nginx (in-place, no downtime)"
            if docker compose ps --status running --services | grep -q '^nginx$'; then
              docker compose exec -T nginx nginx -t
              docker compose exec -T nginx nginx -s reload
            else
              docker compose up -d nginx
            fi

            echo "==> Status"
            docker compose ps
            docker image prune -f
            echo "Deploy complete: ${DEPLOY_SHA}"

  healthcheck:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.result == 'success'
    steps:
      - name: Health check endpoints
        run: |
          set -euo pipefail
          urls=(
            "https://bikehausfreiburg.com"
            "https://admin.bikehausfreiburg.com"
            "https://api.bikehausfreiburg.com/api/public/neue-fahrraeder"
            "https://api.bikehausfreiburg.com/api/public/accessories"
          )
          failed=0
          for url in "${urls[@]}"; do
            echo "Checking $url"
            code=$(curl --retry 5 --retry-delay 5 --connect-timeout 10 --max-time 30 -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if [[ "$code" != "200" ]]; then
              echo "FAIL: $url (status $code)"
              failed=1
            else
              echo "OK:   $url"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All endpoints healthy!"
