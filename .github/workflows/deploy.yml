name: Deploy to Netcup

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_logout:
        description: Rotate the JWT secret to log out all users
        required: false
        default: false
        type: boolean
      deploy_all:
        description: Force deploy all services (api, client, homepage)
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-netcup
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────
  # Detect which services changed. Each subsequent job is gated
  # on its own filter, so unchanged services skip entirely.
  # ───────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      client: ${{ steps.filter.outputs.client }}
      homepage: ${{ steps.filter.outputs.homepage }}
      whatsapp: ${{ steps.filter.outputs.whatsapp }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'BikeHaus.API/**'
              - 'BikeHaus.Application/**'
              - 'BikeHaus.Domain/**'
              - 'BikeHaus.Infrastructure/**'
              - 'BikeHausFreiburg.sln'
              - 'Dockerfile'
            client:
              - 'BikeHaus.Client/**'
            homepage:
              - 'BikeHaus.Homepage/**'
            whatsapp:
              - 'whatsapp-assistant/**'
            infra:
              - 'docker-compose.yml'
              - 'nginx/**'
              - '.github/workflows/deploy.yml'

  # ───────────────────────────────────────────────────────────────
  # Build images on GitHub's runners (fast CPU/RAM + buildx layer
  # cache) and push to GHCR. The VPS no longer builds API/Client —
  # it only pulls — which removes the multi-minute on-server builds.
  # ───────────────────────────────────────────────────────────────
  build-api:
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.infra == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-client:
    needs: changes
    if: |
      needs.changes.outputs.client == 'true' ||
      needs.changes.outputs.infra == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-client
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./BikeHaus.Client
          file: ./BikeHaus.Client/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  build-whatsapp:
    needs: changes
    if: |
      needs.changes.outputs.whatsapp == 'true' ||
      needs.changes.outputs.infra == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-whatsapp
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./whatsapp-assistant
          file: ./whatsapp-assistant/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=whatsapp
          cache-to: type=gha,mode=max,scope=whatsapp

  # ───────────────────────────────────────────────────────────────
  # Sync repository on the server (always runs when anything is
  # being deployed). Other jobs depend on this so they all see the
  # same commit and the .env is up-to-date before any rebuild.
  # ───────────────────────────────────────────────────────────────
  sync-server:
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.client == 'true' ||
      needs.changes.outputs.homepage == 'true' ||
      needs.changes.outputs.whatsapp == 'true' ||
      needs.changes.outputs.infra == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Sync source and write .env
        uses: appleboy/ssh-action@v1
        env:
          FORCE_LOGOUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_logout || 'false' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CAMPAIGN_SMTP_PASSWORD: ${{ secrets.CAMPAIGN_SMTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACES_PLACE_ID: ${{ secrets.GOOGLE_PLACES_PLACE_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: FORCE_LOGOUT,JWT_SECRET_KEY,INDEXNOW_API_KEY,SMTP_PASSWORD,CAMPAIGN_SMTP_PASSWORD,ANTHROPIC_API_KEY,GOOGLE_PLACES_API_KEY,GOOGLE_PLACES_PLACE_ID,GOOGLE_CLIENT_SECRET
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/bikehaus

            echo "==> Resolving secrets"
            if [ "${FORCE_LOGOUT:-false}" = "true" ]; then
              JWT_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\n')
              echo "JWT_SECRET_KEY: forced rotation enabled"
            elif [ -z "${JWT_SECRET_KEY:-}" ]; then
              if [ -f .env ] && grep -q '^JWT_SECRET_KEY=' .env; then
                JWT_SECRET_KEY=$(grep '^JWT_SECRET_KEY=' .env | cut -d'=' -f2-)
                echo "JWT_SECRET_KEY: using existing value from server .env"
              else
                JWT_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\n')
                echo "JWT_SECRET_KEY: generated new value (first deploy)"
              fi
            fi

            _read_env() {
              local key="$1"
              if [ -f .env ] && grep -q "^${key}=" .env; then
                grep "^${key}=" .env | head -n1 | cut -d'=' -f2-
              fi
            }
            [ -z "${INDEXNOW_API_KEY:-}" ] && INDEXNOW_API_KEY="$(_read_env INDEXNOW_API_KEY)"
            [ -z "${GOOGLE_PLACES_API_KEY:-}" ] && GOOGLE_PLACES_API_KEY="$(_read_env GOOGLE_PLACES_API_KEY)"
            [ -z "${GOOGLE_PLACES_PLACE_ID:-}" ] && GOOGLE_PLACES_PLACE_ID="$(_read_env GOOGLE_PLACES_PLACE_ID)"
            [ -z "${SMTP_PASSWORD:-}" ] && SMTP_PASSWORD="$(_read_env SMTP_PASSWORD)"
            [ -z "${CAMPAIGN_SMTP_PASSWORD:-}" ] && CAMPAIGN_SMTP_PASSWORD="$(_read_env CAMPAIGN_SMTP_PASSWORD)"
            [ -z "${ANTHROPIC_API_KEY:-}" ] && ANTHROPIC_API_KEY="$(_read_env ANTHROPIC_API_KEY)"
            [ -z "${GOOGLE_CLIENT_SECRET:-}" ] && GOOGLE_CLIENT_SECRET="$(_read_env GOOGLE_CLIENT_SECRET)"

            echo "==> Updating source"
            echo "Current server commit: $(git rev-parse --short HEAD || echo unknown)"
            git fetch --prune origin master
            git checkout master
            git reset --hard origin/master
            echo "Deploying commit: $(git rev-parse --short HEAD)"

            echo "==> Writing .env"
            umask 077
            printf 'JWT_SECRET_KEY=%s\nINDEXNOW_API_KEY=%s\nGOOGLE_PLACES_API_KEY=%s\nGOOGLE_PLACES_PLACE_ID=%s\nSMTP_HOST=mail.bikehausfreiburg.com\nSMTP_PORT=587\nSMTP_USERNAME=no-reply@bikehausfreiburg.com\nSMTP_PASSWORD=%s\nSMTP_USESSL=false\nSMTP_FROMEMAIL=no-reply@bikehausfreiburg.com\nSMTP_FROMNAME=Bike Haus Freiburg\nCAMPAIGN_SMTP_PASSWORD=%s\nANTHROPIC_API_KEY=%s\nGOOGLE_CLIENT_SECRET=%s\n' \
              "${JWT_SECRET_KEY}" "${INDEXNOW_API_KEY}" "${GOOGLE_PLACES_API_KEY}" "${GOOGLE_PLACES_PLACE_ID}" "${SMTP_PASSWORD}" "${CAMPAIGN_SMTP_PASSWORD}" "${ANTHROPIC_API_KEY}" "${GOOGLE_CLIENT_SECRET}" > .env
            chmod 600 .env

  # ───────────────────────────────────────────────────────────────
  # Deploy API (.NET backend) — runs first, heaviest build
  # ───────────────────────────────────────────────────────────────
  deploy-api:
    needs: [changes, sync-server, build-api]
    if: |
      always() &&
      needs.sync-server.result == 'success' &&
      needs.build-api.result == 'success' &&
      (
        needs.changes.outputs.api == 'true' ||
        needs.changes.outputs.infra == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Pull & recreate API container
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /opt/bikehaus

            echo "==> Logging in to GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> Pulling prebuilt API image from GHCR"
            docker compose pull bikehaus

            echo "==> Recreating API container"
            docker compose up -d bikehaus

            echo "==> Ensuring rental pricing columns exist in SQLite"
            docker run --rm --volumes-from bikehaus-app python:3.12-alpine python -c 'import sqlite3; db="/app/data/BikeHausFreiburg.db"; cols=["RentalPriceDay2","RentalPriceDay4","RentalPriceDay5","RentalPriceDay6","RentalPriceAdditionalDayAfter7"]; conn=sqlite3.connect(db); cur=conn.cursor(); cur.execute("PRAGMA table_info(Bicycles)"); existing={r[1] for r in cur.fetchall()}; [cur.execute(f"ALTER TABLE Bicycles ADD COLUMN {c} REAL NULL") for c in cols if c not in existing]; conn.commit(); conn.close(); print("Schema ensure complete")'

            echo "==> Restarting API after schema ensure"
            docker compose restart bikehaus

            echo "==> API status"
            docker compose ps bikehaus

  # ───────────────────────────────────────────────────────────────
  # Deploy Client (Angular admin SPA) — runs after API
  # ───────────────────────────────────────────────────────────────
  deploy-client:
    needs: [changes, sync-server, deploy-api, build-client]
    if: |
      always() &&
      needs.sync-server.result == 'success' &&
      needs.build-client.result == 'success' &&
      needs.deploy-api.result != 'failure' &&
      needs.deploy-api.result != 'cancelled' &&
      (
        needs.changes.outputs.client == 'true' ||
        needs.changes.outputs.infra == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Pull & recreate Client container
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /opt/bikehaus

            echo "==> Logging in to GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> Pulling prebuilt Client image from GHCR"
            docker compose pull client

            echo "==> Recreating Client container"
            docker compose up -d client

            echo "==> Client status"
            docker compose ps client

  # ───────────────────────────────────────────────────────────────
  # Deploy WhatsApp assistant (Node + Chromium microservice)
  # ───────────────────────────────────────────────────────────────
  deploy-whatsapp:
    needs: [changes, sync-server, build-whatsapp]
    if: |
      always() &&
      needs.sync-server.result == 'success' &&
      needs.build-whatsapp.result == 'success' &&
      (
        needs.changes.outputs.whatsapp == 'true' ||
        needs.changes.outputs.infra == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Pull & recreate WhatsApp container
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /opt/bikehaus

            echo "==> Logging in to GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> Pulling prebuilt WhatsApp image from GHCR"
            docker compose pull whatsapp

            echo "==> Recreating WhatsApp container"
            docker compose up -d whatsapp

            echo "==> WhatsApp status"
            docker compose ps whatsapp

  # ───────────────────────────────────────────────────────────────
  # Build Homepage on the runner (fast: 16GB RAM, 4 vCPU, npm cache).
  # The SSR bundle Angular emits is fully self-contained, so the
  # container only needs the dist/ folder + Node at runtime.
  # ───────────────────────────────────────────────────────────────
  build-homepage:
    needs: changes
    if: |
      needs.changes.outputs.homepage == 'true' ||
      needs.changes.outputs.infra == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BikeHaus.Homepage
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BikeHaus.Homepage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production (SSR + prerender)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: homepage-dist
          path: BikeHaus.Homepage/dist/
          retention-days: 1
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────
  # Deploy Homepage — runs after Client. Downloads the prebuilt
  # dist artifact, ships it to the server via SCP, then rebuilds
  # the (lightweight) container which only copies the dist in.
  # ───────────────────────────────────────────────────────────────
  deploy-homepage:
    needs: [changes, sync-server, deploy-client, build-homepage]
    if: |
      always() &&
      needs.sync-server.result == 'success' &&
      needs.build-homepage.result == 'success' &&
      needs.deploy-client.result != 'failure' &&
      needs.deploy-client.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Download homepage dist
        uses: actions/download-artifact@v8
        with:
          name: homepage-dist
          path: homepage-dist/

      - name: Verify artifact contents
        run: |
          set -euo pipefail
          if [ ! -f homepage-dist/bike-haus.homepage/server/server.mjs ]; then
            echo "ERROR: server.mjs not found in artifact"
            ls -R homepage-dist/ | head -50
            exit 1
          fi
          echo "Artifact OK: $(du -sh homepage-dist | cut -f1)"

      - name: Ship dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'homepage-dist/'
          target: '/opt/bikehaus/BikeHaus.Homepage/dist-staging'
          strip_components: 1
          rm: true

      - name: Promote staging dist and recreate container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/bikehaus/BikeHaus.Homepage

            STAGING=/opt/bikehaus/BikeHaus.Homepage/dist-staging
            LIVE=/opt/bikehaus/BikeHaus.Homepage/dist

            if [ ! -f "${STAGING}/bike-haus.homepage/server/server.mjs" ]; then
              echo "ERROR: staged dist missing server.mjs — aborting"
              exit 1
            fi

            echo "==> Promoting staged dist (atomic swap)"
            rm -rf "${LIVE}.old" 2>/dev/null || true
            if [ -d "${LIVE}" ]; then
              mv "${LIVE}" "${LIVE}.old"
            fi
            mv "${STAGING}" "${LIVE}"

            echo "==> Pulling base image"
            docker pull node:20-alpine

            echo "==> Building Homepage image (just copies prebuilt dist)"
            cd /opt/bikehaus
            docker compose build homepage

            echo "==> Recreating Homepage container"
            docker compose up -d --force-recreate homepage

            echo "==> Syncing homepage-dist for nginx static serving"
            # nginx serves /assets, .js, .css etc. directly from homepage-dist/browser
            # (see nginx.conf). It must match the SSR bundle's hashed filenames,
            # otherwise main-*.js returns 404 and client hydration breaks.
            mkdir -p homepage-dist/browser
            find homepage-dist/browser -mindepth 1 -delete
            cp -a BikeHaus.Homepage/dist/bike-haus.homepage/browser/. homepage-dist/browser/

            echo "==> Homepage status"
            docker compose ps homepage

  # ───────────────────────────────────────────────────────────────
  # Reload nginx after the service chain finishes
  # ───────────────────────────────────────────────────────────────
  reload-nginx:
    needs: [changes, sync-server, deploy-api, deploy-client, deploy-homepage, deploy-whatsapp]
    if: |
      always() &&
      needs.sync-server.result == 'success' &&
      needs.deploy-api.result != 'failure' &&
      needs.deploy-client.result != 'failure' &&
      needs.deploy-homepage.result != 'failure' &&
      needs.deploy-whatsapp.result != 'failure' &&
      needs.deploy-api.result != 'cancelled' &&
      needs.deploy-client.result != 'cancelled' &&
      needs.deploy-homepage.result != 'cancelled' &&
      needs.deploy-whatsapp.result != 'cancelled' &&
      (
        needs.deploy-api.result == 'success' ||
        needs.deploy-client.result == 'success' ||
        needs.deploy-homepage.result == 'success' ||
        needs.deploy-whatsapp.result == 'success' ||
        needs.changes.outputs.infra == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Reload or recreate nginx
        uses: appleboy/ssh-action@v1
        env:
          INFRA_CHANGED: ${{ needs.changes.outputs.infra }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: INFRA_CHANGED,GHCR_TOKEN,GHCR_USER
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/bikehaus

            echo "==> Logging in to GHCR (for any image pulls)"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || true

            # Make sure every backend service nginx proxies to is actually
            # up before we touch nginx. `up -d` without --force-recreate
            # is a no-op if the container is already running and healthy,
            # but will (re)start a stopped/crashed one. Without this step
            # nginx -t can fail with "host not found in upstream" when a
            # backend container is in restart-loop or has been stopped
            # out of band.
            echo "==> Ensuring backend services are up"
            # certbot gehört mit in die Liste: der Renew-Loop läuft in einem
            # eigenen Container, der sonst nie neu erzeugt wird — Änderungen
            # an seinem entrypoint/restart-policy in docker-compose.yml
            # würden nie greifen, und ein nach einem Host-Reboot gestoppter
            # certbot bliebe unbemerkt unten, bis das Zertifikat abläuft.
            docker compose up -d bikehaus client homepage whatsapp certbot

            # Wait up to ~90s for the API to answer its healthcheck. nginx
            # uses a request-time resolver (see nginx.conf), so DNS would
            # still succeed even if the API is down, but pinging it here
            # gives us a real signal and a useful error message in the log
            # if something is fundamentally broken before we reload nginx.
            echo "==> Waiting for API to become healthy"
            api_ok=0
            for i in $(seq 1 30); do
              if docker compose exec -T bikehaus curl -fsS --max-time 5 http://localhost:5000/api/settings > /dev/null 2>&1; then
                echo "[OK] API healthy after ${i} attempt(s)"
                api_ok=1
                break
              fi
              sleep 3
            done
            if [ "${api_ok}" -ne 1 ]; then
              echo "[WARN] API did not become healthy in time — continuing anyway since nginx resolves upstreams lazily"
              docker compose ps bikehaus
              docker compose logs --tail=50 bikehaus || true
            fi

            if [ "${INFRA_CHANGED:-false}" = "true" ]; then
              echo "==> Infra changed — recreating nginx"
              docker compose up -d --force-recreate nginx
            elif docker compose ps --status running --services | grep -q '^nginx$'; then
              echo "==> Reloading nginx in-place"
              if docker compose exec -T nginx nginx -t; then
                docker compose exec -T nginx nginx -s reload
              else
                echo "[WARN] nginx -t failed — falling back to recreate"
                docker compose up -d --force-recreate nginx
              fi
            else
              echo "==> nginx not running — starting it"
              docker compose up -d nginx
            fi

            echo "==> Pruning unused images"
            docker image prune -f

            echo "==> Final status"
            docker compose ps

  # ───────────────────────────────────────────────────────────────
  # Healthcheck
  # ───────────────────────────────────────────────────────────────
  healthcheck:
    runs-on: ubuntu-latest
    needs: [reload-nginx]
    if: needs.reload-nginx.result == 'success'
    steps:
      - name: Health check endpoints
        run: |
          set -euo pipefail
          urls=(
            "https://bikehausfreiburg.com/de"
            "https://admin.bikehausfreiburg.com"
            "https://api.bikehausfreiburg.com/api/public/neue-fahrraeder"
            "https://api.bikehausfreiburg.com/api/public/homepage-accessories"
          )
          failed=0
          for url in "${urls[@]}"; do
            echo "Checking $url"
            code=$(curl --retry 5 --retry-delay 5 --connect-timeout 10 --max-time 30 -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if [[ "$code" != "200" ]]; then
              echo "FAIL: $url (status $code)"
              failed=1
            else
              echo "OK:   $url"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All endpoints healthy!"
