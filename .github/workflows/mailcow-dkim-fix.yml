name: Mailcow DKIM Setup Fix

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  fix-dkim:
    runs-on: ubuntu-latest
    steps:
      - name: Find and generate DKIM key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            MAILCOW_DIR=""
            for d in /opt/mailcow-dockerized /opt/mailcow /root/mailcow-dockerized /root/mailcow ~/mailcow-dockerized ~/mailcow; do
              if [ -d "$d" ] && [ -f "$d/mailcow.conf" ]; then
                MAILCOW_DIR="$d"
                break
              fi
            done
            cd "$MAILCOW_DIR"
            source mailcow.conf

            echo "=== dkim_signing.conf icerigi ==="
            cat "$MAILCOW_DIR/data/conf/rspamd/local.d/dkim_signing.conf" 2>/dev/null
            cat "$MAILCOW_DIR/data/conf/rspamd/override.d/dkim_signing.conf" 2>/dev/null

            echo ""
            echo "=== rspamd data/conf/rspamd klasoru ==="
            ls -la "$MAILCOW_DIR/data/conf/rspamd/" 2>/dev/null

            echo ""
            echo "=== DKIM klasoru (data/conf/rspamd/dkim/) ==="
            ls -la "$MAILCOW_DIR/data/conf/rspamd/dkim/" 2>/dev/null || echo "(dizin yok)"

            echo ""
            echo "=== rspamadm ile DKIM olustur ==="
            DKIM_DIR="$MAILCOW_DIR/data/conf/rspamd/dkim"
            mkdir -p "$DKIM_DIR"
            
            if [ ! -f "$DKIM_DIR/bikehausfreiburg.com.dkim.key" ]; then
              docker compose exec -T rspamd-mailcow rspamadm dkim_keygen \
                -s dkim \
                -d bikehausfreiburg.com \
                -k /tmp/bikehausfreiburg.com.dkim.key \
                > /tmp/bikehausfreiburg.com.dkim.txt 2>&1
              
              # Dosyayi host'a kopyala
              docker compose cp rspamd-mailcow:/tmp/bikehausfreiburg.com.dkim.key "$DKIM_DIR/bikehausfreiburg.com.dkim.key" 2>/dev/null || \
              docker compose exec -T rspamd-mailcow cat /tmp/bikehausfreiburg.com.dkim.key > "$DKIM_DIR/bikehausfreiburg.com.dkim.key"
              
              cat /tmp/bikehausfreiburg.com.dkim.txt 2>/dev/null || echo "txt dosya yok"
              
              echo "=== Olusturulan anahtar ==="
              cat "$DKIM_DIR/bikehausfreiburg.com.dkim.key" 2>/dev/null | head -3
            else
              echo "DKIM key zaten mevcut"
            fi

            echo ""
            echo "=== DKIM public key (DNS icin) ==="
            docker compose exec -T rspamd-mailcow cat /tmp/bikehausfreiburg.com.dkim.txt 2>/dev/null