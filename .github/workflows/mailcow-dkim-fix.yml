name: Mailcow DKIM Setup Fix

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  fix-dkim:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and register DKIM via mailcow API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            MAILCOW_DIR=""
            for d in /opt/mailcow-dockerized /opt/mailcow /root/mailcow-dockerized /root/mailcow ~/mailcow-dockerized ~/mailcow; do
              if [ -d "$d" ] && [ -f "$d/mailcow.conf" ]; then
                MAILCOW_DIR="$d"
                break
              fi
            done
            cd "$MAILCOW_DIR"
            source mailcow.conf

            API_KEY=$(grep -E '^API_KEY=' mailcow.conf | cut -d'=' -f2 | tr -d '"' | tr -d "'" | tr -d '[:space:]')

            echo "=== rspamd mount noktalari ==="
            docker inspect rspamd-mailcow --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{println}}{{end}}' 2>/dev/null

            echo ""
            echo "=== rspamd icindeki tumm dizinler ==="
            docker compose exec -T rspamd-mailcow find /var/lib/rspamd -maxdepth 3 -type d 2>/dev/null

            echo ""
            echo "=== rspamd dkim dosyalari (tum olasi yerler) ==="
            docker compose exec -T rspamd-mailcow find / -name "*.key" -o -name "*dkim*.txt" 2>/dev/null | grep -v proc | head -20

            echo ""
            echo "=== Host dkim dosyalari ==="
            find / -name "*dkim*" -not -path "*/proc/*" 2>/dev/null | head -20

            echo ""
            echo "=== DKIM GET API ==="
            curl -skL "https://127.0.0.1/api/v1/get/dkim/bikehausfreiburg.com" \
              -H "Host: $MAILCOW_HOSTNAME" \
              -H "X-API-Key: $API_KEY"