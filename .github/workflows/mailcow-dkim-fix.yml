name: Mailcow DKIM Setup Fix

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  fix-dkim:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and register DKIM via mailcow API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            MAILCOW_DIR=""
            for d in /opt/mailcow-dockerized /opt/mailcow /root/mailcow-dockerized /root/mailcow ~/mailcow-dockerized ~/mailcow; do
              if [ -d "$d" ] && [ -f "$d/mailcow.conf" ]; then
                MAILCOW_DIR="$d"
                break
              fi
            done
            [ -z "$MAILCOW_DIR" ] && echo "ERROR: mailcow.conf bulunamadi" && exit 1
            cd "$MAILCOW_DIR"
            source mailcow.conf

            API_KEY=$(grep -E '^API_KEY=' mailcow.conf | cut -d'=' -f2 | tr -d '"' | tr -d "'" | tr -d '[:space:]')

            # API_ALLOW_FROM guncelle - 127.0.0.1 ekle
            echo "=== API_ALLOW_FROM guncelleniyor ==="
            CURRENT=$(grep -E '^API_ALLOW_FROM=' mailcow.conf || echo "API_ALLOW_FROM=")
            echo "Mevcut: $CURRENT"
            if grep -q '^API_ALLOW_FROM=' mailcow.conf; then
              sed -i 's|^API_ALLOW_FROM=.*|API_ALLOW_FROM=127.0.0.1,::1|' mailcow.conf
            else
              echo 'API_ALLOW_FROM=127.0.0.1,::1' >> mailcow.conf
            fi
            echo "Yeni: $(grep -E '^API_ALLOW_FROM=' mailcow.conf)"

            # nginx-mailcow reload (API_ALLOW_FROM icin)
            docker compose exec -T nginx-mailcow nginx -s reload 2>/dev/null || docker compose restart nginx-mailcow
            sleep 3

            echo "=== DKIM key olusturuluyor ==="
            RESULT=$(curl -s -X POST "http://127.0.0.1/api/v1/add/dkim" \
              -H "X-API-Key: $API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"dkim_selector":"dkim","domain":["bikehausfreiburg.com"],"key_size":2048}')
            echo "Add result: $RESULT"
            sleep 2

            echo "=== DKIM DNS kaydi ==="
            curl -s "http://127.0.0.1/api/v1/get/dkim/bikehausfreiburg.com" \
              -H "X-API-Key: $API_KEY"