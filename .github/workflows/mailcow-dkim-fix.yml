name: Mailcow DKIM Setup Fix

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  fix-dkim:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and register DKIM via mailcow API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            MAILCOW_DIR=""
            for d in /opt/mailcow-dockerized /opt/mailcow /root/mailcow-dockerized /root/mailcow ~/mailcow-dockerized ~/mailcow; do
              if [ -d "$d" ] && [ -f "$d/mailcow.conf" ]; then
                MAILCOW_DIR="$d"
                break
              fi
            done
            [ -z "$MAILCOW_DIR" ] && echo "ERROR: mailcow.conf bulunamadi" && exit 1
            cd "$MAILCOW_DIR"
            source mailcow.conf

            API_KEY=$(grep -E '^API_KEY=' mailcow.conf | cut -d'=' -f2 | tr -d '"' | tr -d "'" | tr -d '[:space:]')

            # API_ALLOW_FROM: docker bridge + localhost ekle
            if grep -q '^API_ALLOW_FROM=' mailcow.conf; then
              sed -i "s|^API_ALLOW_FROM=.*|API_ALLOW_FROM=127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8|" mailcow.conf
            else
              echo "API_ALLOW_FROM=127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8" >> mailcow.conf
            fi
            echo "API_ALLOW_FROM: $(grep '^API_ALLOW_FROM=' mailcow.conf)"

            # nginx reload
            docker compose exec -T nginx-mailcow nginx -s reload 2>/dev/null || true
            sleep 5

            echo "=== DKIM key olusturuluyor ==="
            RESULT=$(curl -skL -X POST "https://127.0.0.1/api/v1/add/dkim" \
              -H "Host: $MAILCOW_HOSTNAME" \
              -H "X-API-Key: $API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"dkim_selector":"dkim","domain":["bikehausfreiburg.com"],"key_size":2048}')
            echo "Add result: $RESULT"
            sleep 2

            echo "=== DKIM DNS kaydi ==="
            DKIM_RESP=$(curl -skL "https://127.0.0.1/api/v1/get/dkim/bikehausfreiburg.com" \
              -H "Host: $MAILCOW_HOSTNAME" \
              -H "X-API-Key: $API_KEY")
            echo "$DKIM_RESP"