name: Mailcow Mailbox Password

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mailbox:
        description: 'Mailbox (tam adres)'
        required: true
        default: 'info@bikehausfreiburg.com'
      new_password:
        description: 'Yeni şifre (min 8 karakter). Boş bırakırsan sadece mailbox listesi gösterilir, şifre değişmez.'
        required: false
        default: ''

jobs:
  mailbox-password:
    runs-on: ubuntu-latest
    steps:
      - name: Mask password in logs
        run: echo "::add-mask::${{ inputs.new_password }}"

      - name: List mailboxes + (optionally) reset password via SSH
        uses: appleboy/ssh-action@v1
        env:
          MBOX: ${{ inputs.mailbox }}
          NEWPASS: ${{ inputs.new_password }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: MBOX,NEWPASS
          command_timeout: 3m
          script: |
            set -e

            MAILCOW_DIR=""
            for d in /opt/mailcow-dockerized /opt/mailcow /root/mailcow-dockerized /root/mailcow ~/mailcow-dockerized ~/mailcow; do
              if [ -d "$d" ] && [ -f "$d/mailcow.conf" ]; then
                MAILCOW_DIR="$d"
                break
              fi
            done

            if [ -z "$MAILCOW_DIR" ]; then
              echo "ERROR: mailcow.conf bulunamadı"
              exit 1
            fi

            echo "Mailcow dizini: $MAILCOW_DIR"
            cd "$MAILCOW_DIR"
            source mailcow.conf

            echo ""
            echo "=== Mevcut mailbox'lar ==="
            echo "(UI 'Please wait' hatasının kaynağı: <<NULL>> alanı olan kayıt arıza adayıdır)"
            docker compose exec -T mysql-mailcow mysql -u"$DBUSER" -p"$DBPASS" "$DBNAME" -e \
              "SELECT username, COALESCE(NULLIF(name,''),'<<NULL>>') AS name, active, quota, COALESCE(domain,'<<NULL>>') AS domain FROM mailbox ORDER BY username;"

            if [ -z "${NEWPASS:-}" ]; then
              echo ""
              echo ">>> new_password boş — sadece listeleme yapıldı, şifre değiştirilmedi."
              exit 0
            fi

            echo ""
            EXISTS=$(docker compose exec -T mysql-mailcow mysql -N -u"$DBUSER" -p"$DBPASS" "$DBNAME" -e \
              "SELECT COUNT(*) FROM mailbox WHERE username='$MBOX';" | tr -d '\r\n ')
            if [ "$EXISTS" != "1" ]; then
              echo "ERROR: '$MBOX' adlı mailbox yok (count=$EXISTS). Önce oluşturulmalı (mailcow add/mailbox)."
              exit 1
            fi

            HASH=$(docker compose exec -T dovecot-mailcow doveadm pw -s SHA512-CRYPT -p "$NEWPASS" | tr -d '\r\n')

            docker compose exec -T mysql-mailcow mysql -u"$DBUSER" -p"$DBPASS" "$DBNAME" -e \
              "UPDATE mailbox SET password='$HASH', active='1' WHERE username='$MBOX';"

            echo ">>> OK: '$MBOX' şifresi güncellendi."
            echo "    IMAP: mail.bikehausfreiburg.com:993 (SSL/TLS) · SMTP: :587 (STARTTLS) · kullanıcı = tam adres"
