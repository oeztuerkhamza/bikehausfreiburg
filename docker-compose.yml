services:
  bikehaus:
    image: ghcr.io/oeztuerkhamza/bikehausfreiburg-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bikehaus-app
    restart: unless-stopped
    # Harte Obergrenze fuer den Container. Ohne sie konnte das Chromium des
    # Kleinanzeigen-Scrapers (1,2-1,7 GB laut OOM-Log vom 12./23./24.08.) den
    # gesamten Host leerraeumen: Der Kernel-OOM-Killer schlug zu, die Maschine
    # geriet ins Swap-Thrashing und war am 25.08. weder ueber HTTPS noch ueber
    # SSH erreichbar - obwohl auf demselben Host auch Mailcow laeuft.
    # Mit dem Limit trifft es im Ernstfall NUR diesen Container (Docker killt
    # dann Chromium, das den hoechsten oom_score_adj hat), der Rest der
    # Maschine bleibt bedienbar.
    # Groesse: API im Leerlauf ~930 MB + Chromium-Spitze; 2 GB laesst Luft,
    # ohne den Host (3,8 GB, geteilt mit Mailcow) zu gefaehrden.
    mem_limit: 2g
    memswap_limit: 2500m
    ports:
      - '5000:5000'
    volumes:
      - bikehaus-data:/app/data
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_SECRET_KEY}
      - IndexNow__ApiKey=${INDEXNOW_API_KEY}
      - GooglePlaces__ApiKey=${GOOGLE_PLACES_API_KEY}
      - GooglePlaces__PlaceId=${GOOGLE_PLACES_PLACE_ID}
      - PLAYWRIGHT_BROWSERS_PATH=/app/.playwright
      - Smtp__Host=${SMTP_HOST:-mail.bikehausfreiburg.com}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-no-reply@bikehausfreiburg.com}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__UseSsl=${SMTP_USESSL:-false}
      - Smtp__FromEmail=${SMTP_FROMEMAIL:-no-reply@bikehausfreiburg.com}
      - Smtp__FromName=${SMTP_FROMNAME:-Bike Haus Freiburg}
      # Dedicated sender for the review/newsletter campaign ONLY (not transactional mail)
      - CampaignSmtp__Username=${CAMPAIGN_SMTP_USERNAME:-cevdet.akarsu@bikehausfreiburg.com}
      - CampaignSmtp__Password=${CAMPAIGN_SMTP_PASSWORD}
      - CampaignSmtp__FromEmail=${CAMPAIGN_SMTP_FROMEMAIL:-cevdet.akarsu@bikehausfreiburg.com}
      - CampaignSmtp__FromName=${CAMPAIGN_SMTP_FROMNAME:-Cevdet Akarsu}
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY}
      - Api__PublicBaseUrl=https://api.bikehausfreiburg.com
      - Google__ClientId=${GOOGLE_CLIENT_ID:-288460928101-h17vdae2ctjl3l08n50tsnhk8ca5ije5.apps.googleusercontent.com}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Google__RedirectUri=${GOOGLE_REDIRECT_URI:-https://api.bikehausfreiburg.com/api/gmail/callback}
    networks:
      - bikehaus-network

  client:
    image: ghcr.io/oeztuerkhamza/bikehausfreiburg-client:latest
    build:
      context: ./BikeHaus.Client
      dockerfile: Dockerfile
    container_name: bikehaus-client
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - bikehaus-network

  whatsapp:
    image: ghcr.io/oeztuerkhamza/bikehausfreiburg-whatsapp:latest
    build:
      context: ./whatsapp-assistant
      dockerfile: Dockerfile
    container_name: bikehaus-whatsapp
    restart: unless-stopped
    init: true
    expose:
      - '3000'
    volumes:
      - whatsapp-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTO_DRAFT=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=BikeHausFreiburg
      - JWT_AUDIENCE=BikeHausApp
      - FRAME_ANCESTORS=https://admin.bikehausfreiburg.com
    networks:
      - bikehaus-network

  homepage:
    build:
      context: ./BikeHaus.Homepage
      dockerfile: Dockerfile
    container_name: bikehaus-homepage
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
    networks:
      - bikehaus-network

  nginx:
    image: nginx:alpine
    container_name: bikehaus-nginx
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # nginx liest das TLS-Zertifikat nur beim Start bzw. beim Reload ein.
    # Certbot erneuert es in einem EIGENEN Container — ohne diese Schleife
    # bliebe das alte Zertifikat im Speicher, bis es abläuft, und HTTPS wäre
    # tot, obwohl auf der Platte längst ein gültiges Zertifikat liegt.
    # Ein Reload alle 6h ist billig und idempotent.
    command:
      - /bin/sh
      - -c
      - |
        # Primär: auf die Zertifikatsdatei schauen und innerhalb von 5 Minuten
        # nach einer Erneuerung neu laden. Ein reiner 6h-Takt reichte nicht —
        # certbot erneuerte, und nginx lieferte bis zum nächsten Tick weiter
        # das abgelaufene Zertifikat aus.
        # Sekunden statt "5m"/"6h", weil das Suffix in busybox von einem
        # Build-Flag abhängt. Fehlt stat, bleibt der 6h-Takt als Rückfall.
        cert=/etc/letsencrypt/live/bikehausfreiburg.com/fullchain.pem
        last=""
        i=0
        while :; do
          sleep 300 & wait $${!}
          i=$$((i + 1))
          now=$$(stat -c %Y "$$cert" 2>/dev/null || echo "")
          if { [ -n "$$now" ] && [ -n "$$last" ] && [ "$$now" != "$$last" ]; } || [ "$$i" -ge 72 ]; then
            nginx -t > /dev/null 2>&1 && nginx -s reload
            i=0
          fi
          [ -n "$$now" ] && last="$$now"
        done &
        exec nginx -g 'daemon off;'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - ./homepage-dist:/usr/share/nginx/html/homepage:ro
    depends_on:
      - bikehaus
      - client
      - homepage
      - whatsapp
    networks:
      - bikehaus-network

  # Certbot for Let's Encrypt SSL
  certbot:
    image: certbot/certbot
    container_name: bikehaus-certbot
    # Ohne restart-policy bliebe der Renew-Loop nach einem Host-Reboot für
    # immer aus — das Zertifikat liefe still ab.
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - nginx
    # --webroot-path wird explizit gesetzt, damit die Erneuerung nicht davon
    # abhängt, welcher Pfad zufällig in der renewal-conf steht (z. B. nach
    # einem --standalone-Lauf). nginx serviert genau diesen Pfad unter
    # /.well-known/acme-challenge/ auf Port 80.
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path=/var/lib/letsencrypt --non-interactive
          sleep 43200 & wait $${!}   # 12h
        done

volumes:
  bikehaus-data:
    driver: local
  whatsapp-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local

networks:
  bikehaus-network:
    driver: bridge
