worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # WebSocket upgrade eşlemesi (socket.io için — WhatsApp asistanı)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS resolver. Use it from variable-based
    # proxy_pass below so upstreams are resolved at REQUEST time
    # rather than at config-load time. This means `nginx -t` and
    # `nginx -s reload` no longer fail when a backend container is
    # briefly down (e.g. during a rolling deploy); nginx will simply
    # return 502 for the affected route until DNS resolves.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # SSL settings (shared)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ═══════════════════════════════════════════════════════════════
    # HTTP → HTTPS REDIRECTS
    # ═══════════════════════════════════════════════════════════════

    # Redirect all HTTP to HTTPS (except Let's Encrypt challenge)
    server {
        listen 80;
        server_name bikehausfreiburg.com www.bikehausfreiburg.com admin.bikehausfreiburg.com api.bikehausfreiburg.com mail.bikehausfreiburg.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════════
    # HTTPS: www → non-www REDIRECT (duplicate content fix)
    # ═══════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name www.bikehausfreiburg.com;

        ssl_certificate /etc/letsencrypt/live/bikehausfreiburg.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bikehausfreiburg.com/privkey.pem;

        return 301 https://bikehausfreiburg.com$request_uri;
    }

    # ═══════════════════════════════════════════════════════════════
    # HTTPS: PUBLIC HOMEPAGE (bikehausfreiburg.com) — SSR
    # ═══════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name bikehausfreiburg.com;

        ssl_certificate /etc/letsencrypt/live/bikehausfreiburg.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bikehausfreiburg.com/privkey.pem;

        # Serve static assets directly from nginx (fast, cached)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|webmanifest)$ {
            root /usr/share/nginx/html/homepage/browser;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Serve sitemap, robots.txt, llms.txt directly
        location = /sitemap.xml {
            root /usr/share/nginx/html/homepage/browser;
            add_header Content-Type "application/xml; charset=utf-8";
        }
        location = /robots.txt {
            root /usr/share/nginx/html/homepage/browser;
            add_header Content-Type "text/plain; charset=utf-8";
        }
        location = /llms.txt {
            root /usr/share/nginx/html/homepage/browser;
            add_header Content-Type "text/plain; charset=utf-8";
        }
        location = /llms-full.txt {
            root /usr/share/nginx/html/homepage/browser;
            add_header Content-Type "text/plain; charset=utf-8";
        }
        # IndexNow key verification
        location = /b7e4c8a1d3f54e89a2c6b0d7f1e3a5c9.txt {
            root /usr/share/nginx/html/homepage/browser;
            add_header Content-Type "text/plain; charset=utf-8";
        }

        # ─── Legacy URL redirects (old site → Angular routes) ───
        location = /galerie { return 301 https://bikehausfreiburg.com/de/showroom; }
        location = /galerie/ { return 301 https://bikehausfreiburg.com/de/showroom; }
        location = /kontakt { return 301 https://bikehausfreiburg.com/de/contact; }
        location = /kontakt/ { return 301 https://bikehausfreiburg.com/de/contact; }
        location = /reparatur { return 301 https://bikehausfreiburg.com/de/contact; }
        location = /reparatur/ { return 301 https://bikehausfreiburg.com/de/contact; }
        location = /impressum { return 301 https://bikehausfreiburg.com/de/impressum; }
        location = /datenschutz { return 301 https://bikehausfreiburg.com/de/datenschutz; }
        location = /uber-uns { return 301 https://bikehausfreiburg.com/de/about; }
        location = /ueber-uns { return 301 https://bikehausfreiburg.com/de/about; }
        location = /fahrrad-verleih { return 301 https://bikehausfreiburg.com/de/fahrradverleih; }
        location = /fahrrad-verleih/ { return 301 https://bikehausfreiburg.com/de/fahrradverleih; }

        # Dynamic product sitemap — proxy to API (serves from main domain for Google)
        location = /sitemap-products.xml {
            set $bikehaus_api "bikehaus:5000";
            proxy_pass http://$bikehaus_api/api/public/sitemap-products.xml;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Content-Type "application/xml; charset=utf-8";
            proxy_cache_valid 200 1h;
        }

        # All other routes → SSR (Node.js server)
        location / {
            set $homepage_ssr "homepage:4000";
            proxy_pass http://$homepage_ssr$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;

            # In case the SSR upstream ever sets its own framing header, drop it
            # so our CSP frame-ancestors below is the single source of truth.
            proxy_hide_header X-Frame-Options;
        }

        # Security headers
        # The public homepage may be embedded as a LIVE DEMO on the portfolio
        # (hamzaoeztuerk.de). X-Frame-Options cannot whitelist a third-party
        # origin (ALLOW-FROM is unsupported in modern browsers), so we use CSP
        # frame-ancestors instead — it allows self + the portfolio only, and
        # takes precedence over X-Frame-Options where both are present.
        add_header Content-Security-Policy "frame-ancestors 'self' https://hamzaoeztuerk.de https://www.hamzaoeztuerk.de https://*.vercel.app http://localhost:4200 http://localhost:4000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ═══════════════════════════════════════════════════════════════
    # HTTPS: ADMIN PANEL (admin.bikehausfreiburg.com)
    # ═══════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name admin.bikehausfreiburg.com;

        ssl_certificate /etc/letsencrypt/live/bikehausfreiburg.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bikehausfreiburg.com/privkey.pem;

        # Bilder OHNE Ratelimit (siehe api.-Serverblock): das Adminpanel lädt in
        # Listen/Verfügbarkeit viele Fotos gleichzeitig über /api/public/gallery-image/,
        # die sonst unter das /api/-Limit fielen und sporadisch auf 503 kippten.
        location /api/public/gallery-image/ {
            set $bikehaus_api "bikehaus:5000";
            proxy_pass http://$bikehaus_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # API reverse proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            set $bikehaus_api "bikehaus:5000";
            proxy_pass http://$bikehaus_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        # WhatsApp asistanı (ayrı Node servisi) — /wa/ altında, aynı origin.
        # Admin panelde iframe ile gömülür. /wa/ öneki soyulur; socket.io için
        # WebSocket upgrade desteklenir. Servis kendi JWT doğrulamasını yapar.
        location = /wa { return 301 /wa/; }
        location /wa/ {
            set $bikehaus_whatsapp "whatsapp:3000";
            rewrite ^/wa/(.*)$ /$1 break;
            proxy_pass http://$bikehaus_whatsapp;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Angular Admin SPA — served by dedicated client container
        location / {
            set $bikehaus_client "client:80";
            proxy_pass http://$bikehaus_client$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ═══════════════════════════════════════════════════════════════
    # HTTPS: API (api.bikehausfreiburg.com)
    # ═══════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name api.bikehausfreiburg.com;

        ssl_certificate /etc/letsencrypt/live/bikehausfreiburg.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bikehausfreiburg.com/privkey.pem;

        # Fahrrad-/Zubehörbilder: statische Dateien, die NICHT dem API-Ratelimit
        # unterliegen dürfen. Die Verleihseite lädt viele Bilder gleichzeitig;
        # mit dem Limit (10r/s, burst 20) kippten einzelne Anfragen auf 503, was
        # sich als sporadisch fehlende Fahrradfotos zeigte. Dateinamen sind GUIDs
        # (unveränderlich) → lange cachebar, das dämpft die Last zusätzlich.
        location /uploads/ {
            set $bikehaus_api "bikehaus:5000";
            proxy_pass http://$bikehaus_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Bilder auch über den API-Endpunkt (gleiche Ausnahme wie /uploads/).
        location /api/public/gallery-image/ {
            set $bikehaus_api "bikehaus:5000";
            proxy_pass http://$bikehaus_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # All API requests
        location / {
            limit_req zone=api burst=20 nodelay;
            set $bikehaus_api "bikehaus:5000";
            proxy_pass http://$bikehaus_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        # CORS is handled by the .NET API middleware — do NOT add duplicate headers here
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ═══════════════════════════════════════════════════════════════
    # HTTPS: MAIL HOST (mail.bikehausfreiburg.com) — Mailcow webmail
    # Reverse-proxy snippet adapted from mailcow docs to avoid the
    # ERR_TOO_MANY_REDIRECTS loop: Mailcow's internal nginx redirects
    # HTTP→HTTPS unless it sees X-Forwarded-Proto=https AND we leave
    # its Location headers untouched (proxy_redirect off).
    # ═══════════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name mail.bikehausfreiburg.com;

        ssl_certificate /etc/letsencrypt/live/bikehausfreiburg.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bikehausfreiburg.com/privkey.pem;

        # Allow large mail attachments (uploads via SOGo / Mailcow UI)
        client_max_body_size 0;

        location / {
            # Mailcow's HTTP port (8081) unconditionally redirects to HTTPS
            # regardless of X-Forwarded-Proto. Connect directly to its HTTPS
            # port (8444) to bypass the redirect entirely.
            proxy_pass https://host.docker.internal:8444;
            proxy_ssl_verify off;
            proxy_http_version 1.1;

            proxy_redirect off;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;

            proxy_read_timeout 3600s;
            proxy_connect_timeout 30s;
        }
    }

    # ═══════════════════════════════════════════════════════════════
    # FALLBACK: Catch-all for IP/unknown hosts
    # ═══════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt;
        }

        location / {
            return 301 https://bikehausfreiburg.com$request_uri;
        }
    }
}
